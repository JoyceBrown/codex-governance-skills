name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository and embedded skill tests
        shell: pwsh
        run: ./scripts/validate-repository.ps1
