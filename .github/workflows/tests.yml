name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository and embedded skill tests
        shell: pwsh
        run: ./scripts/validate-repository.ps1
